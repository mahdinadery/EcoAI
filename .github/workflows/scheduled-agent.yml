name: Scheduled auto-publish (analysis + Bale)

# Fires EcoAI's scheduler "tick" every 5 minutes. The tick is a cheap no-op
# unless one of the times configured in the dashboard (ارسال خودکار زمان‌بندی‌شده)
# is due; then the app fetches English economic feeds, translates & summarizes
# pending articles in Persian, and sends qualifying posts to Bale automatically.
#
# Why an external cron: Render free tier has no built-in scheduler and sleeps
# after 15 minutes of inactivity; GitHub Actions cron wakes the app on schedule.
#
# Setup (once): GitHub -> Settings -> Secrets and variables -> Actions:
#   APP_URL          e.g. https://ecoai.onrender.com (trailing slash optional)
#   ADMIN_ACCESS_KEY same value as ADMIN_ACCESS_KEY in Render Environment
#
# GitHub only runs `schedule` on the default branch (`main`). Use "Run workflow" to test.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-agent-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ secrets.APP_URL }}
      ADMIN_ACCESS_KEY: ${{ secrets.ADMIN_ACCESS_KEY }}
    steps:
      - name: Scheduler tick (runs only at configured times)
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret is not set — skipping scheduled tick until configured."
            echo "Set APP_URL and ADMIN_ACCESS_KEY in Repository Secrets to enable scheduled publishing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          APP_URL="${APP_URL%/}"
          set -o pipefail
          curl -fsS --max-time 300 --retry 2 --retry-all-errors --retry-delay 30 \
            -X POST "$APP_URL/api/agent/scheduler/tick" \
            -H 'content-type: application/json' -d '{}' \
            ${ADMIN_ACCESS_KEY:+-H "x-admin-key: $ADMIN_ACCESS_KEY"} \
            -o /tmp/scheduler-result.json
          head -c 12000 /tmp/scheduler-result.json
          python3 -c 'import json; d=json.load(open("/tmp/scheduler-result.json")); assert d.get("success"), "Scheduler reported failure"'
