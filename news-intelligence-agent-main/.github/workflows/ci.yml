name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # The app requires DATABASE_URL to be *defined* at import time (module-level
      # pool) and the `postinstall` db-ensure hook tries to connect. No workflow
      # here touches a live database: every page is force-dynamic and the unit
      # tests are pure, so a dummy URL is enough (connections fail fast on
      # localhost and db-ensure soft-fails via `|| true`).
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
