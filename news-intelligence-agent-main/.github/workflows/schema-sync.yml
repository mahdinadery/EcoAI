name: Schema sync (db:ensure)

# On-demand, additive-only schema provisioning against the real Neon database.
# This exists because the sandbox/dev environment cannot reach port 5432, while
# GitHub-hosted runners can. Safe by design: scripts/db-ensure.mjs is
# idempotent and NEVER drops/rewrites data. Useful after enabling Neon's
# auto-suspend, after restoring a branch, or before the first deploy.
#
# Requires repository secret: DATABASE_URL (the pooled Neon string, same value
# as in Render's environment).

on:
  workflow_dispatch:

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Skip when not configured
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.cfg.outputs.run == 'true'
      - name: Run additive schema sync
        if: steps.cfg.outputs.run == 'true'
        run: npm run db:ensure
      - name: Verify expected tables exist
        if: steps.cfg.outputs.run == 'true'
        run: |
          node - <<'EOF'
          const { Pool } = require("pg");
          (async () => {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
            const { rows } = await pool.query(
              `select table_name from information_schema.tables
                where table_schema = 'public' order by 1`
            );
            console.log("public tables:", rows.map((r) => r.table_name).join(", ") || "(none)");
            const cols = await pool.query(
              `select table_name || '.' || column_name as c from information_schema.columns
                where table_schema='public' and column_name in ('topic_filter','auto_send_policy','items_filtered','audience_focus') order by 1`
            );
            console.log("expected columns present:", cols.rows.map((r) => r.c).join(", ") || "(none)");
            const missing = ["ai_configurations.audience_focus"].filter(
              (want) => !cols.rows.some((r) => r.c === want)
            );
            if (missing.length > 0) {
              console.error("missing after sync:", missing.join(", "));
              process.exit(1);
            }
            await pool.end();
          })().catch((e) => {
            console.error("verify failed:", String(e.message).slice(0, 200));
            process.exit(1);
          });
          EOF
