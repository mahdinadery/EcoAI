# Render Blueprint — zero-server deployment straight from GitHub (free tier).
#
# How to use:
#   1. Create a free PostgreSQL database (e.g. Neon — free plan, pooled
#      connection string already contains ?sslmode=require, which `pg` supports).
#   2. In Render: New -> Blueprint -> connect this GitHub repo. Render reads
#      this file and creates the service below, redeploying on every push.
#   3. For every `sync: false` variable, set the value ONCE in the Render
#      dashboard (Environment tab). NEVER put real secrets in this file.
#
# Schema sync is automatic on deploy: `npm start` runs the `prestart` hook
# (scripts/db-ensure.mjs — additive-only, idempotent), so the "forgot to run
# db:ensure" class of breakages cannot happen on platforms without shell access.
services:
  - type: web
    name: news-intelligence-agent
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # --- database (required) ---
      - key: DATABASE_URL
        sync: false
      # --- admin gate: SET THIS, or the /admin area is open to the internet ---
      - key: ADMIN_ACCESS_KEY
        sync: false
      # --- AI provider (optional; analyze falls back to "missing_key") ---
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE_URL
        sync: false
      - key: AI_API_MODEL
        sync: false
      # --- Bale bot delivery (optional) ---
      - key: BALE_BOT_TOKEN
        sync: false
      - key: BALE_CHAT_ID
        sync: false
      - key: BALE_DELIVERY_MODE
        sync: false
      # --- auto-send policy fallbacks (dashboard config takes precedence) ---
      - key: AUTO_SEND_ENABLED
        sync: false
      - key: AUTO_SEND_DESTINATION
        sync: false
      - key: AUTO_SEND_MIN_IMPORTANCE
        sync: false
      - key: AUTO_SEND_MAX_ITEMS
        sync: false
      # --- legacy single-feed source (optional; sources now live in DB) ---
      - key: NEWS_SOURCE_RSS_URL
        sync: false
      # --- outbound proxy for feeds that block non-Iran IPs (optional) ---
      - key: NEWS_FETCH_PROXY_URL
        sync: false
