# Render Blueprint — zero-server deployment straight from GitHub (free tier).
#
# How to use:
#   1. Create a free PostgreSQL database on Neon (https://neon.tech) and copy
#      the *Pooled* connection string (?sslmode=require is already included).
#   2. In Render: either use New + -> Blueprint OR New + -> Web Service and
#      connect `mahdinadery/EcoAI` (no Root Directory override needed).
#   3. Fill in the `sync: false` secrets once in Render's Environment tab.
#      NEVER commit real secrets in this file.
#
# Schema sync is automatic on deploy: `npm start` runs the `prestart` hook
# (`scripts/db-ensure.mjs` — additive-only, idempotent).
services:
  - type: web
    name: ecoai
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # --- database (required: Neon pooled connection string) ---
      - key: DATABASE_URL
        sync: false
      # --- admin gate: SET THIS, or /admin is open to the internet ---
      - key: ADMIN_ACCESS_KEY
        sync: false
      # --- AI provider (OpenAI / Groq / OpenRouter compatible) ---
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE_URL
        sync: false
      - key: AI_API_MODEL
        sync: false
      # --- Bale messenger bot delivery ---
      - key: BALE_BOT_TOKEN
        sync: false
      - key: BALE_CHAT_ID
        sync: false
      - key: BALE_DELIVERY_MODE
        sync: false
      # --- auto-send policy fallbacks (dashboard config takes precedence) ---
      - key: AUTO_SEND_ENABLED
        sync: false
      - key: AUTO_SEND_DESTINATION
        sync: false
      - key: AUTO_SEND_MIN_IMPORTANCE
        sync: false
      - key: AUTO_SEND_MAX_ITEMS
        sync: false
      # --- legacy single-feed fallback (optional; sources live in DB) ---
      - key: NEWS_SOURCE_RSS_URL
        sync: false
      # --- optional outbound proxy for feed/article fetching ---
      - key: NEWS_FETCH_PROXY_URL
        sync: false
